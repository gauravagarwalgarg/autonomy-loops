# AutonomyLoops + Orbit Full observability stack
# Includes agent runtime, Ollama (local LLM), Redis (state), Jaeger (traces), Prometheus (metrics)

services:
  agent:
    build: .
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AUTONOMY_LOOPS_CONFIG=/app/autonomy-loops.yaml
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./autonomy-loops.yaml:/app/autonomy-loops.yaml:ro
      - ./styles:/app/styles:ro
    depends_on:
      - redis
      - otel-collector
      - ollama
    networks:
      - autonomy

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - autonomy
    deploy:
      resources:
        reservations:
          memory: 4G

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - autonomy

  otel-collector:
    image: otel/opentelemetry-collector:latest
    ports:
      - "4317:4317"   # gRPC OTLP
      - "4318:4318"   # HTTP OTLP
    volumes:
      - ./otel-config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - autonomy

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - autonomy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    networks:
      - autonomy

volumes:
  redis-data:
  ollama-models:

networks:
  autonomy:
    driver: bridge
