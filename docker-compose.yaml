# AutonomyLoops Full observability stack
# Includes agent runtime, Redis (state), Jaeger (traces), Prometheus (metrics)

version: "3.9"

services:
  agent:
    build: .
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AUTONOMY_LOOPS_CONFIG=/app/autonomy-loops.yaml
    volumes:
      - ./autonomy-loops.yaml:/app/autonomy-loops.yaml:ro
      - ./styles:/app/styles:ro
    depends_on:
      - redis
      - otel-collector
    networks:
      - autonomy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - autonomy

  otel-collector:
    image: otel/opentelemetry-collector:latest
    ports:
      - "4317:4317"   # gRPC OTLP
      - "4318:4318"   # HTTP OTLP
    volumes:
      - ./otel-config.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - autonomy

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - autonomy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    networks:
      - autonomy

volumes:
  redis-data:

networks:
  autonomy:
    driver: bridge
