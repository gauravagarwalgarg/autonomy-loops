# AutonomyLoops CI/CD Pipeline
# Platform: GitLab CI/CD
# Mirrors: .github/workflows/ci.yml (GitHub Actions)
# Docs: Both platforms deploy MkDocs Material to their respective Pages service.

# Avoid duplicate pipelines (branch + MR)
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  PYTHON_VERSION: "3.12"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pip-cache/

# --- Lint & Type Check --------------------------------------------------------

lint:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install ruff mypy
    - ruff check autonomy_loops/ tests/
    - ruff format --check autonomy_loops/ tests/
  rules:
    - if: $CI_COMMIT_REF_NAME

typecheck:
  stage: lint
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install -e ".[dev]"
    - mypy autonomy_loops/
  rules:
    - if: $CI_COMMIT_REF_NAME
  allow_failure: true

# --- Tests --------------------------------------------------------------------

test:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install -e ".[dev,all]"
    - pytest tests/ -v --cov=autonomy_loops --cov-report=xml --cov-report=term-missing
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/TOTAL.*\s+(\d+)%/'
  rules:
    - if: $CI_COMMIT_REF_NAME

# --- Build Package ------------------------------------------------------------

build-package:
  stage: build
  image: python:${PYTHON_VERSION}-slim
  script:
    - pip install build
    - python -m build
    - ls -lh dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- Build Documentation (MkDocs) --------------------------------------------

build-docs:
  stage: build
  image: python:${PYTHON_VERSION}-slim
  variables:
    # Override MkDocs config for GitLab deployment
    MKDOCS_SITE_URL: "${CI_PAGES_URL}/"
    MKDOCS_REPO_URL: "${CI_PROJECT_URL}"
    MKDOCS_REPO_NAME: "${CI_PROJECT_PATH}"
    MKDOCS_EDIT_URI: "-/edit/main/docs/"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null 2>&1
    - pip install mkdocs-material mkdocs-minify-plugin mkdocs-git-revision-date-localized-plugin
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_REF_NAME

# --- Deploy Documentation to GitLab Pages ------------------------------------

pages:
  stage: deploy
  needs:
    - job: build-docs
      artifacts: true
    - job: test
      artifacts: false
  script:
    - echo "Deploying documentation to GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: documentation
    url: $CI_PAGES_URL

# --- Review Pages (MR previews) ----------------------------------------------

pages:review:
  stage: deploy
  needs:
    - job: build-docs
      artifacts: true
  script:
    - echo "Deploying MR preview"
  artifacts:
    paths:
      - public
  pages:
    path_prefix: "mr-$CI_MERGE_REQUEST_IID"
    expire_in: 1 week
  environment:
    name: review/mr-$CI_MERGE_REQUEST_IID
    url: "${CI_PAGES_URL}/mr-${CI_MERGE_REQUEST_IID}"
    on_stop: pages:review:stop
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:review:stop:
  stage: deploy
  variables:
    GIT_STRATEGY: none
  dependencies: []
  script:
    - echo "Removing MR preview"
  when: manual
  environment:
    name: review/mr-$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# --- Docker Image (main branch only) -----------------------------------------

docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
