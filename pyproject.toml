[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomy-loops"
version = "2.0.0"
description = "Production-ready multi-agent orchestration framework for steering, scaling, and governing autonomous AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "AutonomyLoops Contributors" },
]
keywords = ["ai", "agents", "orchestration", "llm", "multi-agent", "autonomy", "steering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "pydantic>=2.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "structlog>=23.0",
    "click>=8.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
bedrock = ["boto3>=1.28"]
all = ["openai>=1.0", "anthropic>=0.30", "boto3>=1.28"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
]

[project.scripts]
autonomy-loops = "autonomy_loops.cli:main"

[project.urls]
Homepage = "https://github.com/GauravAgarwalGarg/AutonomyLoops"
Documentation = "https://gauravagrawalgarg.github.io/AutonomyLoops/"
Repository = "https://github.com/GauravAgarwalGarg/AutonomyLoops"
"GitLab Mirror" = "https://gitlab.com/GauravAgarwalGarg/AutonomyLoops"
Issues = "https://github.com/GauravAgarwalGarg/AutonomyLoops/issues"
Changelog = "https://gauravagrawalgarg.github.io/AutonomyLoops/changelog/"

[tool.hatch.build.targets.wheel]
packages = ["autonomy_loops"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "PT"]
ignore = ["S101"]  # Allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "orbit",
    "orbit.*",
    "yaml",
    "yaml.*",
    "openai",
    "openai.*",
    "anthropic",
    "anthropic.*",
    "structlog",
    "structlog.*",
    "opentelemetry",
    "opentelemetry.*",
    "httpx",
    "httpx.*",
]
ignore_missing_imports = true
